[package]
name = "brisa-browser"
version = "1.0.5"
edition = "2024"
license = "MIT"

[[bin]]
name = "brisa"
path = "src/main.rs"

[dependencies]
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver"] }
base64 = "0.22"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.100", default-features = false }
windows-result = { version = "0.100", features = ["std"] }
windows-webview = { version = "0.100", path = "vendor/windows-webview" }
windows-window = "0.100"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Networking_WinHttp", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = "debuginfo"

[profile.release.package.windows-webview]
opt-level = 1
codegen-units = 1
